    <h1>台東精選必吃店家 🍽️</h1>
    <p>以下為來台東旅遊時不容錯過的代表性美食：</p>

    <hr>

    <h2>1. 在地特色米苔目</h2>
    <p> Q彈有勁的米苔目搭配柴魚片與濃郁湯頭，是台東最具代表性的傳統早餐與正餐之一。</p>

    <h2>2. 藍蜻蜓 / 阿鋐炸雞</h2>
    <p>台東在地皮薄多汁的台式炸雞老店，是許多人來到台東必吃的懷舊滋味。</p>

    <h2>3. 原住民風味料理</h2>
    <p>運用馬告、刺蔥與阿拜 (A-bai) 等在地食材，體驗最道地的原住民飲食文化。</p>
